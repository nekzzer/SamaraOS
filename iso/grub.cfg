set timeout=5
set default=0

# bios: the kernel draws to VGA text memory early on, so keep grub in text
# mode. uefi has no text mode, kernel takes the gop framebuffer from multiboot2
if [ "$grub_platform" = "efi" ]; then
    set gfxpayload=keep
    insmod all_video
else
    set gfxpayload=text
    terminal_output console
fi

menuentry "SamaraOS" {
    if [ "$grub_platform" = "efi" ]; then
        multiboot2 /boot/samara.elf
        module2 /boot/install.tar
    else
        multiboot /boot/samara.elf
        module /boot/install.tar
    fi
}

# For a keyboard whose '/' key is broken and keeps firing (scancode 0x35).
menuentry "SamaraOS (ignore broken / key)" {
    if [ "$grub_platform" = "efi" ]; then
        multiboot2 /boot/samara.elf kbd_ignore=35
    else
        multiboot /boot/samara.elf kbd_ignore=35
    fi
}
