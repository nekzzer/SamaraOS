set timeout=5
set default=0

# The kernel writes text directly to the VGA text-mode framebuffer
# (0xB8000). GRUB defaults to a graphical VESA mode for its own
# terminal, and if it stays there the kernel's text writes land in
# the wrong place (black screen with a few stray colored pixels).
# Force plain VGA text mode before handing off.
set gfxpayload=text
terminal_output console

menuentry "SamaraOS" {
    multiboot /boot/samara.elf
}

# For a keyboard whose '/' key is broken and keeps firing (scancode 0x35).
menuentry "SamaraOS (ignore broken / key)" {
    multiboot /boot/samara.elf kbd_ignore=35
}
